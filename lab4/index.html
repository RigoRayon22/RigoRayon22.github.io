<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sign Up</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">
  <div class="container mt-5">
    <div class="card p-4 shadow mx-auto" style="max-width: 650px;">
      <h1 class="h3 text-center mb-3">Sign Up Form</h1>

      <form id="signupForm">
        <label class="form-label">Zip Code</label>
        <input id="zip" class="form-control" maxlength="5" placeholder="e.g. 93955">
        <div id="zipMsg" class="small text-danger"></div>

        <div class="mt-2 p-2 bg-white border rounded">
          City: <span id="city"></span><br>
          Latitude: <span id="lat"></span><br>
          Longitude: <span id="lon"></span>
        </div>

        <div class="row mt-3">
          <div class="col">
            <label class="form-label">State</label>
            <select id="state" class="form-select"></select>
            <div id="stateMsg" class="small text-danger"></div>
          </div>
          <div class="col">
            <label class="form-label">County</label>
            <select id="county" class="form-select"></select>
            <div id="countyMsg" class="small text-danger"></div>
          </div>
        </div>

        <label class="form-label mt-3">Desired Username</label>
        <input id="username" class="form-control" placeholder="at least 3 characters">
        <div id="userMsg" class="small fw-bold"></div>

        <label class="form-label mt-3">Password</label>
        <input id="password" type="password" class="form-control" placeholder="at least 6 characters">
        <div id="suggest" class="small text-muted"></div>

        <label class="form-label mt-3">Retype Password</label>
        <input id="retype" type="password" class="form-control">
        <div id="matchMsg" class="small fw-bold"></div>

        <button class="btn btn-primary w-100 mt-4" type="submit">Sign up!</button>
        <div id="submitMsg" class="mt-2 fw-bold"></div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
